<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面不存在 · hans窝</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --bg:#0d0f14; --text:#e8eaf0; --dim:#8b93a7; --accent:#7c9cff; --accent-2:#b48cff; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text); text-align:center; padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(1200px 500px at 50% -10%, rgba(124,156,255,.16), transparent 70%);
  }
  .code {
    font-size:clamp(72px,18vw,140px); font-weight:700; line-height:1; letter-spacing:4px;
    background:linear-gradient(120deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  h1 { margin-top:14px; font-size:clamp(18px,4vw,26px); font-weight:600; }
  p { margin-top:12px; color:var(--dim); line-height:1.8; }
  a {
    display:inline-block; margin-top:28px; padding:12px 26px; border-radius:999px;
    color:#0d0f14; font-weight:600; text-decoration:none;
    background:linear-gradient(120deg,var(--accent),var(--accent-2));
  }
  a:hover { filter:brightness(1.08); }
</style>
</head>
<body>
  <div class="code">404</div>
  <h1>这个页面不存在</h1>
  <p>链接可能已失效，或者路径写错了。<br>不妨回首页看看文章、相册和 B 站动态。</p>
  <a href="/">返回首页</a>
</body>
</html>
