<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hans窝</title>
<style>
  :root {
    --bg: #0d0f14;
    --panel: #171a22;
    --panel-2: #1e2230;
    --text: #e8eaf0;
    --text-dim: #8b93a7;
    --accent: #7c9cff;
    --accent-2: #b48cff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- 顶部 ---------- */
  header {
    padding: 44px 20px 18px;
    text-align: center;
    background: radial-gradient(1200px 500px at 50% -10%, rgba(124,156,255,.16), transparent 70%);
  }
  header h1 {
    font-size: clamp(28px, 5vw, 44px);
    letter-spacing: 2px;
    font-weight: 700;
    background: linear-gradient(120deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header p {
    margin-top: 10px;
    color: var(--text-dim);
    font-size: 14px;
    letter-spacing: 1px;
  }

  /* ---------- 标签导航 ---------- */
  .tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 14px 20px;
  }
  .tabs button {
    appearance: none;
    border: 1px solid rgba(255,255,255,.08);
    background: var(--panel);
    color: var(--text-dim);
    padding: 9px 22px;
    border-radius: 999px;
    font-size: 14px;
    cursor: pointer;
    transition: all .2s ease;
    letter-spacing: 1px;
  }
  .tabs button:hover { color: var(--text); border-color: rgba(255,255,255,.25); }
  .tabs button.active {
    color: #fff;
    border-color: transparent;
    background: linear-gradient(120deg, var(--accent), var(--accent-2));
    box-shadow: 0 4px 18px rgba(124,156,255,.35);
  }

  .view { display: none; }
  .view.active { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- 文章页 ---------- */
  .article-wrap {
    display: flex;
    gap: 24px;
    max-width: 1100px;
    margin: 0 auto;
    padding: 8px 20px 60px;
    align-items: flex-start;
  }
  .article-list {
    flex: 0 0 280px;
    position: sticky;
    top: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .article-list-item {
    appearance: none;
    text-align: left;
    border: 1px solid rgba(255,255,255,.08);
    background: var(--panel);
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    color: var(--text);
    transition: all .2s ease;
    font-family: inherit;
  }
  .article-list-item:hover { border-color: rgba(255,255,255,.25); transform: translateY(-1px); }
  .article-list-item.active {
    border-color: transparent;
    background: linear-gradient(120deg, rgba(124,156,255,.22), rgba(180,140,255,.22));
    box-shadow: 0 4px 16px rgba(124,156,255,.15);
  }
  .article-list-item .a-title { display: block; font-size: 14px; font-weight: 600; }
  .article-list-item .a-desc {
    display: block; margin-top: 4px; font-size: 12px; color: var(--text-dim);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .article-list-item .a-date {
    display: inline-block; margin-top: 8px; font-size: 11px; color: var(--text-dim);
    background: rgba(255,255,255,.06); padding: 2px 8px; border-radius: 999px;
  }

  .article-body {
    flex: 1;
    min-width: 0;
    background: var(--panel);
    border: 1px solid rgba(255,255,255,.06);
    border-radius: 16px;
    padding: 32px 36px;
    line-height: 1.75;
    font-size: 15px;
  }
  .article-body .loading, .article-body .error { color: var(--text-dim); }

  /* Markdown 渲染样式 */
  .md-body h1, .md-body h2, .md-body h3, .md-body h4 {
    margin: 1.4em 0 .6em;
    line-height: 1.3;
    letter-spacing: .5px;
  }
  .md-body h1 { font-size: 1.7em; }
  .md-body h2 { font-size: 1.4em; padding-bottom: .3em; border-bottom: 1px solid rgba(255,255,255,.1); }
  .md-body h3 { font-size: 1.15em; }
  .md-body p { margin: .8em 0; }
  .md-body a { color: var(--accent); text-decoration: none; }
  .md-body a:hover { text-decoration: underline; }
  .md-body ul, .md-body ol { margin: .8em 0; padding-left: 1.6em; }
  .md-body li { margin: .35em 0; }
  .md-body blockquote {
    margin: 1em 0;
    padding: 8px 16px;
    border-left: 3px solid var(--accent);
    background: rgba(124,156,255,.07);
    border-radius: 0 8px 8px 0;
    color: var(--text-dim);
  }
  .md-body code {
    background: rgba(255,255,255,.08);
    padding: 2px 6px;
    border-radius: 5px;
    font-size: .9em;
    font-family: "SF Mono", Consolas, "Courier New", monospace;
  }
  .md-body pre {
    background: #10131b;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 10px;
    padding: 14px 16px;
    overflow-x: auto;
    margin: 1em 0;
  }
  .md-body pre code { background: none; padding: 0; }
  .md-body table { border-collapse: collapse; margin: 1em 0; width: 100%; }
  .md-body th, .md-body td { border: 1px solid rgba(255,255,255,.15); padding: 8px 12px; }
  .md-body th { background: rgba(255,255,255,.06); }
  .md-body img { max-width: 100%; border-radius: 10px; margin: .5em 0; }
  .md-body hr { border: none; border-top: 1px solid rgba(255,255,255,.12); margin: 1.5em 0; }
  .md-body input[type="checkbox"] { margin-right: 6px; }

  @media (max-width: 760px) {
    .article-wrap { flex-direction: column; padding: 8px 12px 40px; }
    .article-list { flex: none; width: 100%; position: static; flex-direction: row; overflow-x: auto; }
    .article-list-item { flex: 0 0 240px; }
    .article-body { padding: 20px 18px; }
  }

  /* ---------- 网址页 ---------- */
  .link-wrap { max-width: 1000px; margin: 0 auto; padding: 8px 20px 60px; }
  .link-section { margin-bottom: 34px; }
  .link-section h2 {
    font-size: 15px;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .link-section h2::after {
    content: ""; flex: 1; height: 1px; background: rgba(255,255,255,.08);
  }
  .link-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }
  .link-card {
    display: block;
    background: var(--panel);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 14px;
    padding: 18px 20px;
    text-decoration: none;
    color: var(--text);
    transition: all .2s ease;
  }
  .link-card:hover {
    border-color: rgba(124,156,255,.5);
    transform: translateY(-3px);
    box-shadow: 0 10px 24px rgba(0,0,0,.4);
  }
  .link-card .l-name {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 15px;
    font-weight: 600;
  }
  .link-card .l-name::after { content: "↗"; color: var(--accent); font-size: 14px; }
  .link-card .l-desc { margin-top: 6px; font-size: 12px; color: var(--text-dim); }

  /* ---------- 图片页 ---------- */
  .filters {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    padding: 8px 20px 20px;
  }
  .filters button {
    appearance: none;
    border: 1px solid rgba(255,255,255,.08);
    background: var(--panel);
    color: var(--text-dim);
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    transition: all .2s ease;
    letter-spacing: .5px;
  }
  .filters button:hover { color: var(--text); border-color: rgba(255,255,255,.25); }
  .filters button.active {
    color: #fff;
    border-color: transparent;
    background: linear-gradient(120deg, var(--accent), var(--accent-2));
    box-shadow: 0 4px 18px rgba(124,156,255,.35);
  }
  .filters button .count { opacity: .6; margin-left: 6px; font-size: 11px; }

  .gallery {
    columns: 3;
    column-gap: 16px;
    max-width: 1600px;
    margin: 0 auto;
    padding: 8px 20px 60px;
  }
  @media (max-width: 1100px) { .gallery { columns: 2; } }
  @media (max-width: 640px)  { .gallery { columns: 2; column-gap: 8px; padding: 4px 8px 40px; } }

  .card {
    break-inside: avoid;
    margin-bottom: 16px;
    border-radius: 14px;
    overflow: hidden;
    position: relative;
    background: var(--panel-2);
    cursor: zoom-in;
    box-shadow: 0 2px 10px rgba(0,0,0,.35);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  @media (max-width: 640px) { .card { margin-bottom: 8px; border-radius: 10px; } }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 26px rgba(0,0,0,.5); }

  .card img {
    display: block;
    width: 100%;
    height: auto;
    opacity: 0;
    transition: opacity .4s ease, transform .4s ease;
  }
  .card img.loaded { opacity: 1; }
  .card img:hover { transform: scale(1.03); }

  .card .tag {
    position: absolute;
    left: 10px;
    bottom: 10px;
    padding: 3px 10px;
    font-size: 11px;
    border-radius: 999px;
    background: rgba(13,15,20,.55);
    backdrop-filter: blur(6px);
    color: rgba(255,255,255,.85);
    letter-spacing: .5px;
    opacity: 0;
    transform: translateY(4px);
    transition: all .25s ease;
    pointer-events: none;
  }
  .card:hover .tag { opacity: 1; transform: translateY(0); }

  .card .placeholder {
    position: absolute;
    inset: 0;
    background: linear-gradient(110deg, var(--panel-2) 40%, #262b3d 50%, var(--panel-2) 60%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite linear;
  }
  @keyframes shimmer {
    0% { background-position: 120% 0; }
    100% { background-position: -80% 0; }
  }

  /* ---------- 灯箱 ---------- */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(5,6,9,.92);
    backdrop-filter: blur(8px);
  }
  .lightbox.open { display: flex; }

  .lightbox img {
    max-width: 92vw;
    max-height: 88vh;
    border-radius: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    animation: pop .22s ease;
  }
  @keyframes pop {
    from { transform: scale(.96); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .lb-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 46px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.15);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    transition: background .2s ease;
    user-select: none;
  }
  .lb-btn:hover { background: rgba(255,255,255,.2); }
  .lb-prev { left: 18px; }
  .lb-next { right: 18px; }

  .lb-close {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.15);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    transition: background .2s ease;
  }
  .lb-close:hover { background: rgba(255,255,255,.2); }

  .lb-info {
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--text-dim);
    font-size: 13px;
    letter-spacing: .5px;
    background: rgba(0,0,0,.45);
    padding: 6px 14px;
    border-radius: 999px;
    white-space: nowrap;
  }

  footer {
    text-align: center;
    padding: 20px;
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<header>
  <h1 id="site-title">hans窝</h1>
  <p id="site-subtitle">无聊</p>
</header>

<nav class="tabs">
  <button data-view="articles" class="active">文章</button>
  <button data-view="links">常用网址</button>
  <button data-view="gallery">图片</button>
</nav>

<!-- 文章 -->
<section class="view active" id="view-articles">
  <div class="article-wrap">
    <aside class="article-list" id="article-list"></aside>
    <div class="article-body md-body" id="article-body"><p class="loading">加载中…</p></div>
  </div>
</section>

<!-- 常用网址 -->
<section class="view" id="view-links">
  <div class="link-wrap" id="link-wrap"></div>
</section>

<!-- 图片 -->
<section class="view" id="view-gallery">
  <nav class="filters" id="filters"></nav>
  <main class="gallery" id="gallery"></main>
</section>

<footer>Powered by GitHub Pages</footer>

<!-- 灯箱 -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lb-close" aria-label="关闭">&times;</button>
  <button class="lb-btn lb-prev" id="lb-prev" aria-label="上一张">&#10094;</button>
  <img id="lb-img" alt="">
  <button class="lb-btn lb-next" id="lb-next" aria-label="下一张">&#10095;</button>
  <div class="lb-info" id="lb-info"></div>
</div>

<script src="images.js"></script>
<script src="articles.js"></script>
<script src="links.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
  /* ========== 标签切换 ========== */
  let articleLoaded = false;

  function switchView(name) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + name).classList.add('active');
    document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.view === name));
    if (name === 'articles' && !articleLoaded && ARTICLES.length) {
      articleLoaded = true;
      loadArticle(ARTICLES[0]);
    }
  }

  document.querySelectorAll('.tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      const v = btn.dataset.view;
      location.hash = v;
      switchView(v);
    });
  });

  const VALID_VIEWS = ['articles', 'links', 'gallery'];
  function viewFromHash() {
    const h = location.hash.replace('#', '');
    return VALID_VIEWS.includes(h) ? h : 'gallery';
  }
  window.addEventListener('hashchange', () => switchView(viewFromHash()));

  /* ========== 文章 ========== */
  function renderArticleList() {
    const list = document.getElementById('article-list');
    list.innerHTML = ARTICLES.map(a => `
      <button class="article-list-item" data-file="${a.file}">
        <span class="a-title">${a.title}</span>
        <span class="a-desc">${a.desc || ''}</span>
        <span class="a-date">${a.date}</span>
      </button>
    `).join('');
    list.querySelectorAll('.article-list-item').forEach(btn => {
      btn.addEventListener('click', () => loadArticle(ARTICLES.find(a => a.file === btn.dataset.file)));
    });
  }

  async function loadArticle(a) {
    const body = document.getElementById('article-body');
    body.innerHTML = '<p class="loading">加载中…</p>';
    document.querySelectorAll('.article-list-item').forEach(el => el.classList.remove('active'));
    const item = document.querySelector(`.article-list-item[data-file="${a.file}"]`);
    if (item) item.classList.add('active');
    try {
      const res = await fetch(a.file);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      body.innerHTML = window.marked ? marked.parse(text) : '<pre>' + text.replace(/</g, '&lt;') + '</pre>';
    } catch (e) {
      body.innerHTML = `<p class="error">文章加载失败：${a.file}</p>`;
    }
  }

  renderArticleList();

  /* ========== 常用网址 ========== */
  function renderLinks() {
    const wrap = document.getElementById('link-wrap');
    wrap.innerHTML = LINKS.map(sec => `
      <div class="link-section">
        <h2>${sec.cat}</h2>
        <div class="link-grid">
          ${sec.items.map(l => `
            <a class="link-card" href="${l.url}" target="_blank" rel="noopener">
              <span class="l-name">${l.name}</span>
              <span class="l-desc">${l.desc || ''}</span>
            </a>
          `).join('')}
        </div>
      </div>
    `).join('');
  }
  renderLinks();

  /* ========== 图片画廊 ========== */
  function enc(p) { return encodeURI(p); }

  const galleryEl = document.getElementById('gallery');
  const filtersEl = document.getElementById('filters');

  // 拍平所有图片
  let allImages = [];
  GALLERY.groups.forEach(g => {
    g.images.forEach(src => allImages.push({ src, groupName: g.name }));
  });

  const counts = {};
  GALLERY.groups.forEach(g => { counts[g.id] = g.images.length; });

  let activeFilter = 'all';
  let currentItems = [];

  function renderFilters() {
    const html = [];
    html.push(`<button data-filter="all" class="${activeFilter==='all'?'active':''}">全部 <span class="count">${allImages.length}</span></button>`);
    GALLERY.groups.forEach(g => {
      html.push(`<button data-filter="${g.id}" class="${activeFilter===g.id?'active':''}">${g.name} <span class="count">${counts[g.id]}</span></button>`);
    });
    filtersEl.innerHTML = html.join('');
    filtersEl.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        activeFilter = btn.dataset.filter;
        renderFilters();
        renderGallery();
      });
    });
  }

  function renderGallery() {
    const group = GALLERY.groups.find(g => g.id === activeFilter);
    const items = activeFilter === 'all'
      ? allImages
      : group.images.map(src => ({ src, groupName: group.name }));

    currentItems = items;

    galleryEl.innerHTML = items.map((item, i) => `
      <figure class="card" data-index="${i}">
        <div class="placeholder"></div>
        <img src="${enc(item.src)}" alt="${item.groupName}" loading="lazy">
        <figcaption class="tag">${item.groupName}</figcaption>
      </figure>
    `).join('');

    galleryEl.querySelectorAll('img').forEach(img => {
      if (img.complete) { img.classList.add('loaded'); }
      else { img.addEventListener('load', () => img.classList.add('loaded')); }
    });

    galleryEl.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => openLightbox(parseInt(card.dataset.index, 10)));
    });
  }

  /* ========== 灯箱 ========== */
  const lightbox = document.getElementById('lightbox');
  const lbImg = document.getElementById('lb-img');
  const lbInfo = document.getElementById('lb-info');
  let lbIndex = 0;

  function openLightbox(i) {
    lbIndex = i;
    showLightbox();
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function showLightbox() {
    const item = currentItems[lbIndex];
    lbImg.src = enc(item.src);
    lbImg.alt = item.groupName;
    lbInfo.textContent = `${item.groupName} · ${lbIndex + 1} / ${currentItems.length}`;
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
  }

  function step(d) {
    lbIndex = (lbIndex + d + currentItems.length) % currentItems.length;
    showLightbox();
  }

  document.getElementById('lb-close').addEventListener('click', closeLightbox);
  document.getElementById('lb-prev').addEventListener('click', () => step(-1));
  document.getElementById('lb-next').addEventListener('click', () => step(1));
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });

  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });

  /* ========== 初始化 ========== */
  renderFilters();
  renderGallery();
  switchView(viewFromHash());
</script>
</body>
</html>
